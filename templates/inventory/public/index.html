<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main><header><p>Company tools</p><h1>Inventory</h1><p>Available stock updates when Orders reserves or releases an item.</p></header>
<button id="refresh" type="button">Refresh stock</button><p id="error" role="alert"></p>
<table><caption>Available to reserve</caption><thead><tr><th scope="col">Item</th><th scope="col">SKU</th><th scope="col">Available</th></tr></thead><tbody id="stock"></tbody></table>
<p id="status" role="status">Loading stock…</p></main></body></html>
