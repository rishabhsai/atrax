<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Inventory</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main><header><p>Card shop tools <span class="demo">Demo data</span></p><h1>Card Inventory</h1><p>Graded singles, sealed product, and supplies on hand. Quantities drop when Card Orders reserves an item and return when an order is cancelled.</p></header>
<button id="refresh" type="button">Refresh stock</button><p id="error" role="alert"></p>
<table><caption>Available to sell</caption><thead><tr><th scope="col">Item</th><th scope="col">Grade</th><th scope="col">SKU</th><th scope="col" class="number">Price</th><th scope="col" class="number">Available</th></tr></thead><tbody id="stock"></tbody></table>
<p id="status" role="status">Loading stock…</p></main></body></html>
